[package]
name = "vacuumd"
version = "0.2.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
flate2 = "1.1.10"
font8x8 = "0.3.1"
hex = "0.4.3"
md-5 = "0.11.0"
png = "0.18.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std", "process", "fs"] }

[profile.release]
strip = true        # smaller downloads
lto = true
codegen-units = 1
