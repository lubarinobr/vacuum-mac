name: Windows app

# Tests the Windows app's page in Chromium (the engine behind Windows' WebView2), including against the real
# vacuumd server, and builds the Windows program. Runs on every branch push that touches the app or vacuumd.

on:
  push:
    branches: ["**", "!dependabot/**"]
    paths: ["windows/**", "rust/**", ".github/workflows/windows-app.yml"]
  pull_request:
    paths: ["windows/**", "rust/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

concurrency:
  group: windows-app-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  page-tests:
    name: Page tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/tests/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: Build vacuumd (the real robot service for the live tests)
        working-directory: rust
        run: cargo build --release --locked
      - name: Install dependencies and Chromium
        working-directory: windows/tests
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Run the page tests
        working-directory: windows/tests
        run: npm test
        env:
          SHOT_DIR: ${{ runner.temp }}/screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: page-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  windows-build:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            windows/src-tauri
            rust
      - name: Build the app
        working-directory: windows/src-tauri
        run: cargo build --release --locked
      - name: Build the robot service
        working-directory: rust
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item windows/src-tauri/target/release/vacuum-windows.exe dist/Vacuum.exe
          Copy-Item rust/target/release/vacuumd.exe dist/vacuumd.exe
          Compress-Archive -Path dist/Vacuum.exe, dist/vacuumd.exe -DestinationPath dist/Vacuum-windows-x86_64.zip
      - name: Check the service starts
        run: ./dist/vacuumd.exe version
      - uses: actions/upload-artifact@v7
        with:
          name: Vacuum-windows-x86_64
          path: dist/Vacuum-windows-x86_64.zip
