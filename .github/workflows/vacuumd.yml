name: vacuumd

# Tests the server on Windows, macOS and Linux; builds downloads for Windows (x64), macOS (Intel, Apple Silicon
# and a universal one) and Linux (x64); and publishes them as a GitHub Release when a version tag is pushed:
#
#   git tag daemon-v0.2.0 && git push origin daemon-v0.2.0
#
# The tag starts with "daemon-" so these releases never replace the Mac app's releases (v1.x) as "Latest".
#
# Third-party actions are pinned to an exact commit (a tag can be moved, and this workflow publishes programs
# people will run). Dependabot proposes updates to the pins.

on:
  push:
    # Both lists are needed: with only "tags", GitHub ignores pushes to branches completely.
    # Every branch, so work in progress is tested before a pull request exists. Not Dependabot's: its pull
    # request already starts a run, and a push run on top doubled every update.
    branches: ["**", "!dependabot/**"]
    tags: ["daemon-v*"]
    paths: ["rust/**", ".github/workflows/vacuumd.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/vacuumd.yml"]
  workflow_dispatch:

# A push to a branch with an open pull request starts two runs (push and pull request); only the newest of
# each branch is kept.
concurrency:
  group: vacuumd-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: rust

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: A release tag must match the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/daemon-v')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "daemon-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in rust/Cargo.toml"
            exit 1
          fi
      - run: cargo test --locked

  windows:
    name: Build (Windows x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - run: cargo build --release --locked
      - name: Check it starts
        run: ./target/release/vacuumd.exe version
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/vacuumd.exe -DestinationPath dist/vacuumd-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vacuumd-windows-x86_64
          path: rust/dist/*
          if-no-files-found: error

  macos:
    name: Build (macOS Intel, Apple Silicon, universal)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Build both architectures (running on macOS 11 and newer)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
      - name: Universal binary (runs on both) and signatures
        run: |
          mkdir -p stage/intel stage/arm64 stage/universal dist
          cp target/x86_64-apple-darwin/release/vacuumd stage/intel/
          cp target/aarch64-apple-darwin/release/vacuumd stage/arm64/
          # The oldest macOS each one accepts must stay 11.0, so macOS 13 and older Macs keep working.
          for dir in intel arm64; do
            minos=$(otool -l stage/$dir/vacuumd | grep -A4 LC_BUILD_VERSION | awk '/minos/ {print $2}')
            echo "$dir needs macOS $minos"
            test "$minos" = "11.0"
          done
          lipo -create -output stage/universal/vacuumd stage/intel/vacuumd stage/arm64/vacuumd
          # Apple Silicon refuses unsigned code; an ad-hoc signature is enough for a downloaded command-line tool.
          for dir in intel arm64 universal; do codesign --force --sign - stage/$dir/vacuumd; codesign --verify stage/$dir/vacuumd; done
          file stage/*/vacuumd
          stage/arm64/vacuumd version
          tar -C stage/intel -czf dist/vacuumd-macos-x86_64.tar.gz vacuumd
          tar -C stage/arm64 -czf dist/vacuumd-macos-arm64.tar.gz vacuumd
          tar -C stage/universal -czf dist/vacuumd-macos-universal.tar.gz vacuumd
      - uses: actions/upload-artifact@v4
        with:
          name: vacuumd-macos
          path: rust/dist/*
          if-no-files-found: error

  linux:
    name: Build (Linux x64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - run: cargo build --release --locked
      - run: |
          ./target/release/vacuumd version
          mkdir -p dist
          tar -C target/release -czf dist/vacuumd-linux-x86_64.tar.gz vacuumd
      - uses: actions/upload-artifact@v4
        with:
          name: vacuumd-linux-x86_64
          path: rust/dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/daemon-v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version, skill and checksums
        id: info
        run: |
          echo "version=${GITHUB_REF_NAME#daemon-v}" >> "$GITHUB_OUTPUT"
          (cd skills && zip -r ../dist/vacuum-robot-skill.zip vacuum-robot)
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: vacuumd ${{ steps.info.outputs.version }}
          files: dist/*
          make_latest: "false"  # the Mac app's release stays "Latest"
          generate_release_notes: true
          body: |
            **vacuumd** lets AI agents (MCP) and the Vacuum app control a Xiaomi Robot Vacuum X20+. No Mac app is needed.

            | Your computer | Download |
            |---|---|
            | Windows (64-bit) | `vacuumd-windows-x86_64.zip` |
            | Mac with an Intel chip | `vacuumd-macos-x86_64.tar.gz` |
            | Mac with Apple Silicon (M1 or newer) | `vacuumd-macos-arm64.tar.gz` |
            | Any Mac | `vacuumd-macos-universal.tar.gz` |
            | Linux (64-bit, experimental) | `vacuumd-linux-x86_64.tar.gz` |

            Macs need macOS 11 or newer. Unpack the file, then in a terminal in that folder:

            ```
            ./vacuumd install      # Windows: .\vacuumd.exe install
            vacuumd setup          # in a NEW terminal: sign in to Xiaomi once to find your robot
            vacuumd status         # check that it is running and the robot answers
            ```

            `install` prints the line that connects your AI agent. `vacuum-robot-skill.zip` is an optional skill that teaches agents how to use the tools well.

            The programs are not signed with a paid certificate: Windows may show SmartScreen (*More info → Run anyway*), and macOS may need `xattr -d com.apple.quarantine ./vacuumd` once. Checksums are in `SHA256SUMS.txt`. Full guide: [rust/README.md](https://github.com/${{ github.repository }}/blob/main/rust/README.md).
